[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false                       # OBLIGATORIO false: mismo motivo que el foundry.toml
                                     # de Sobrecito (contracts/foundry.toml), el verifier
                                     # --optimized no converge con via_ir=true ("Could not
                                     # create stack layout after 1000 iterations").
fs_permissions = [
  { access = "read", path = "../circuits-mini/yield_cut" },
  { access = "read", path = "test/fixtures" },
]
gas_reports = ["*"]
